<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0A12" />
<title>Metas Pessoais</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #0D0A12;
    --surface: #171220;
    --surfaceHi: #1F1829;
    --border: #2A2233;
    --accent: #9409B7;
    --accentLight: #C13FE0;
    --lime: #30D8EE;
    --text: #F5F1FA;
    --muted: #8F8698;
    --amber: #F0A340;
    --gold: #F2B84B;
    --pink: #E85D9C;
    --green: #6EE7B7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #050308;
    color: var(--text);
    font-family: Inter, -apple-system, system-ui, sans-serif;
  }
  #app {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    padding: 16px 16px 90px;
  }
  h1.page-title {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 8px 0 16px;
  }
  .btn-icon {
    width: 36px; height: 36px; border-radius: 12px;
    background: var(--accent); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
  }
  .row-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-label {
    font-family: Inter; font-weight: 600; font-size: 13px; color: var(--muted);
    text-transform: capitalize; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .goal-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .goal-card.avulso { border-style: dashed; border-color: #C13FE066; }
  .goal-title { flex: 1; font-size: 14px; }
  .goal-time { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); }
  .goal-del {
    background: transparent; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px;
  }
  .goal-edit {
    background: transparent; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px;
  }
  .empty-msg { text-align: center; padding: 40px 0; font-size: 13px; color: var(--muted); }

  nav.tabbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 388px;
    background: var(--surfaceHi); border: 1px solid var(--border); border-radius: 20px;
    display: flex; padding: 6px; gap: 4px; z-index: 5;
  }
  nav.tabbar button {
    flex: 1; padding: 10px 0; border-radius: 14px; border: none; background: transparent;
    font-family: Inter; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  nav.tabbar button.active { background: var(--accent); color: #fff; }

  .sheet-overlay {
    position: fixed; inset: 0; background: #000000aa; display: flex; align-items: flex-end;
    z-index: 20; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 420px; background: var(--bg); border-top: 1px solid var(--border);
    border-radius: 24px 24px 0 0; padding: 18px 18px 26px; max-height: 88vh; overflow-y: auto;
  }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-title { font-family: "Big Shoulders Display", sans-serif; font-weight: 700; font-size: 20px; }
  .sheet-close {
    width: 30px; height: 30px; border-radius: 50%; background: var(--surfaceHi); border: none;
    color: var(--muted); font-size: 16px; cursor: pointer;
  }
  .field-label {
    font-family: Inter; font-weight: 600; font-size: 12px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .field-group { margin-bottom: 14px; }
  input[type="text"], input[type="time"], input[type="date"], input[type="number"] {
    width: 100%; background: var(--surfaceHi); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-family: Inter; font-size: 14px; color: var(--text); outline: none;
  }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    flex: 1 1 40%; padding: 9px 0; border-radius: 10px; text-transform: capitalize;
    font-family: Inter; font-weight: 600; font-size: 12.5px; text-align: center;
    border: 1.5px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
  }
  .pill.active { border-color: currentColor; }
  .weekday-row { display: flex; gap: 6px; }
  .weekday-btn {
    width: 36px; height: 36px; border-radius: 50%; font-family: Inter; font-weight: 600; font-size: 12.5px;
    border: 1.5px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
  }
  .weekday-btn.active { background: var(--accent); border-color: var(--accentLight); color: #fff; }
  .save-btn {
    width: 100%; padding: 13px 0; border-radius: 12px; border: none; font-family: Inter;
    font-weight: 700; font-size: 14px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accentLight)); color: #fff;
  }
  .save-btn:disabled { opacity: .5; cursor: default; background: var(--border); color: var(--muted); }
  .hint { font-family: Inter; font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }

  #notif-banner {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px; display: none; align-items: center; gap: 10px;
  }
  #notif-banner button {
    padding: 8px 12px; border-radius: 10px; border: none; background: var(--accent); color: #fff;
    font-family: Inter; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .placeholder { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>
  <div id="app">
    <div id="notif-banner">
      <span style="flex:1; font-size:12.5px;">Ativa as notificações pra não perder nenhum lembrete.</span>
      <button id="btn-activate-notif">Ativar</button>
    </div>

    <div id="tab-content"></div>

    <nav class="tabbar">
      <button data-tab="hoje">Hoje</button>
      <button data-tab="metas">Metas</button>
      <button data-tab="progresso">Progresso</button>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
