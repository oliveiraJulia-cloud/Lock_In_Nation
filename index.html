<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0A12" />
<title>Metas Pessoais</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0D0A12;
    color: #F5F1FA;
    font-family: -apple-system, Inter, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #171220;
    border: 1px solid #2A2233;
    border-radius: 20px;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #8F8698; font-size: 13px; margin: 0 0 20px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1F1829;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 13.5px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.pending { background: #2A2233; border: 1.5px solid #8F8698; }
  .dot.ok { background: #30D8EE; }
  .dot.err { background: #E85D9C; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 13px 0;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #9409B7, #C13FE0);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  code {
    display: block;
    background: #0D0A12;
    border: 1px solid #2A2233;
    border-radius: 8px;
    padding: 8px;
    font-size: 10px;
    color: #8F8698;
    word-break: break-all;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Metas Pessoais</h1>
    <p class="sub">Etapa 4 · teste de instalação e notificação</p>

    <div class="row"><span id="dot-sw" class="dot pending"></span> Service worker</div>
    <div class="row"><span id="dot-auth" class="dot pending"></span> Login anônimo</div>
    <div class="row"><span id="dot-perm" class="dot pending"></span> Permissão de notificação</div>
    <div class="row"><span id="dot-token" class="dot pending"></span> Token salvo no Firestore</div>

    <button id="btn-activate">Ativar notificações</button>
    <code id="log">Aguardando…</code>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
